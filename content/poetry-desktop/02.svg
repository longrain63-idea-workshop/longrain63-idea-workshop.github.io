      <line x1="455" y1="348" x2="575" y2="348" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="515" y="424" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" fill="#ded3bf" text-anchor="middle">隐约雷鸣</text><text x="515" y="482" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" fill="#ded3bf" text-anchor="middle">阴霾天空</text><text x="515" y="540" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" fill="#ded3bf" text-anchor="middle">但盼风雨来</text><text x="515" y="598" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" fill="#ded3bf" text-anchor="middle">能留你在此</text>
      <text x="515" y="712" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#a89a86" text-anchor="middle">柿本人麻吕</text>
