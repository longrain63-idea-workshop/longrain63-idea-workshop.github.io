      <rect x="1015" y="222" width="140" height="34" rx="17" fill="#ffffff" opacity=".07"/>
      <text x="1085" y="245" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#cbbfa8" text-anchor="middle">答</text>
      <text x="1085" y="320" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" fill="#f1e8d6" text-anchor="middle">和风答章</text>
      <line x1="1025" y1="348" x2="1145" y2="348" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="1085" y="424" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" fill="#ded3bf" text-anchor="middle">隐约雷鸣</text><text x="1085" y="482" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" fill="#ded3bf" text-anchor="middle">阴霾天空</text><text x="1085" y="540" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" fill="#ded3bf" text-anchor="middle">即使天无雨</text><text x="1085" y="598" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" fill="#ded3bf" text-anchor="middle">我亦留此地</text>
      <text x="1085" y="712" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#a89a86" text-anchor="middle">大伴家持</text>
