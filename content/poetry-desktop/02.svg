      <stop offset="0" stop-color="#241a2b"/>
      <stop offset=".5" stop-color="#4a3448"/>
      <stop offset="1" stop-color="#8a5f4e"/>
    </linearGradient>
    <radialGradient id="sunset" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 760) scale(560)">
      <stop offset="0" stop-color="#f0a978" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f0a978" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette2" cx=".5" cy=".5" r=".78">
      <stop offset=".5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".5"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky2)"/>
