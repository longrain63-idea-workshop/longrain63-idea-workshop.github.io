<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1224"/>
      <stop offset=".55" stop-color="#1d2f52"/>
      <stop offset="1" stop-color="#3b4a63"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1270 200) scale(240)">
      <stop offset="0" stop-color="#f6e9c6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f6e9c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a47"/>
      <stop offset="1" stop-color="#0e1729"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".45"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="90" cy="70" r="1.8" fill="#ffffff" opacity=".4"/><circle cx="180" cy="140" r="1.2" fill="#ffffff" opacity=".4"/><circle cx="260" cy="60" r="1.6" fill="#ffffff" opacity=".4"/><circle cx="360" cy="120" r="1.2" fill="#ffffff" opacity=".4"/><circle cx="470" cy="70" r="1.4" fill="#ffffff" opacity=".4"/><circle cx="560" cy="150" r="1.2" fill="#ffffff" opacity=".4"/><circle cx="680" cy="80" r="1.6" fill="#ffffff" opacity=".4"/><circle cx="790" cy="130" r="1.2" fill="#ffffff" opacity=".4"/><circle cx="900" cy="60" r="1.4" fill="#ffffff" opacity=".4"/><circle cx="1010" cy="120" r="1.6" fill="#ffffff" opacity=".4"/><circle cx="1120" cy="70" r="1.2" fill="#ffffff" opacity=".4"/><circle cx="1230" cy="150" r="1.4" fill="#ffffff" opacity=".4"/><circle cx="1340" cy="80" r="1.6" fill="#ffffff" opacity=".4"/><circle cx="1450" cy="130" r="1.2" fill="#ffffff" opacity=".4"/><circle cx="1510" cy="60" r="1.4" fill="#ffffff" opacity=".4"/><circle cx="130" cy="230" r="1.2" fill="#ffffff" opacity=".4"/><circle cx="1530" cy="220" r="1.2" fill="#ffffff" opacity=".4"/><circle cx="70" cy="320" r="1.4" fill="#ffffff" opacity=".4"/>
  <circle cx="1270" cy="200" r="240" fill="url(#halo)"/>
  <circle cx="1270" cy="200" r="88" fill="#f7edd2"/>
  <circle cx="1240" cy="176" r="14" fill="#e9dcb8" opacity=".7"/>
  <circle cx="1296" cy="230" r="20" fill="#e9dcb8" opacity=".5"/>
  <path d="M0 640 C 220 590 360 650 540 616 C 720 582 860 640 1040 606 C 1220 572 1400 630 1600 596 V1000 H0 Z" fill="url(#ridge1)"/>
  <path d="M0 730 C 200 690 400 745 620 710 C 840 675 1060 735 1280 700 C 1420 678 1520 700 1600 690 V1000 H0 Z" fill="#0b1322"/>
  <path d="M0 850 C 260 820 520 870 800 840 C 1080 810 1340 860 1600 830 V1000 H0 Z" fill="#070c16"/>
  <rect x="470" y="200" width="660" height="520" rx="16" fill="#0a1020" opacity=".34"/>
  <rect x="470" y="200" width="660" height="520" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="800" y="300" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" fill="#f3ecdd" text-anchor="middle">山居秋暝</text><text x="800" y="392" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" fill="#e6dcc7" text-anchor="middle">空山新雨后，天气晚来秋。</text><text x="800" y="444" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" fill="#e6dcc7" text-anchor="middle">明月松间照，清泉石上流。</text><text x="800" y="496" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" fill="#e6dcc7" text-anchor="middle">竹喧归浣女，莲动下渔舟。</text><text x="800" y="548" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" fill="#e6dcc7" text-anchor="middle">随意春芳歇，王孙自可留。</text>
  <line x1="700" y1="336" x2="900" y2="336" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="800" y="640" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#bdb4a2" text-anchor="middle">王维 · 唐</text>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
